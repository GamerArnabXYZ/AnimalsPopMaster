name: Auto Release APK Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# GitHub Releases ko modify karne ke liye token permissions zaroori hain
permissions:
  contents: write 

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install required Android SDK components
        run: |
          # AGP 8.11 ko Platform 36 (compileSdk/targetSdk) aur Build-Tools 35+ chahiye.
          # Runner image mein pehle se ho sakta hai, lekin explicitly install karna
          # safe hai taaki build kabhi bhi "missing SDK component" pe fail na ho.
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "build-tools;35.0.0"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Release APKs
        # Yeh command aapke sabhi release APKs generate karegi
        run: ./gradlew assembleRelease

      - name: Sign APKs with Debug Keystore
        run: |
          # 1. Ek temporary debug keystore generate karein
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          
          # 2. Android Build Tools ka path find karein
          BUILD_TOOLS_VERSION=$(ls $ANDROID_HOME/build-tools | sort -n | tail -1)
          
          # 3. Har generate hue unsigned APK ko align aur sign karein
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "Processing $apk..."
            # Zipalign karna zaroori hai sign karne se pehle
            $ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/zipalign -f -p 4 "$apk" "aligned.apk"
            mv "aligned.apk" "$apk"
            
            # APK ko debug keystore se sign karein
            $ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner sign --ks debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android "$apk"
          done

      - name: Delete Old Release and Tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Purana 'latest' release aur tag delete karein (agar exist karta hai) taaki storage full na ho
          gh release delete latest --cleanup-tag -y || true
          git push --delete origin latest || true

      - name: Upload New Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Release Build"
          body: "Auto-generated release APKs (Signed with Debug Keystore)."
          # `release` folder mein jitne bhi APKs honge sab upload ho jayenge
          files: app/build/outputs/apk/release/*.apk
          prerelease: false

  build-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install required Android SDK components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "build-tools;35.0.0"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Debug APKs
        # Debug build -> BuildConfig.DEBUG=true, isliye Level Editor (home
        # screen ke "By GamerArnabXYZ" text ko 3-sec long-press karke khulta
        # hai) yahan kaam karega. Signing automatic hai (AGP khud debug
        # keystore generate/use karta hai) -> manual zipalign/apksigner
        # step ki zaroorat nahi. minify/shrink OFF hai isliye APK size
        # release se bada hoga - ye normal hai, debug build ke liye expected.
        run: ./gradlew assembleDebug

      - name: Delete Old Debug Release and Tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete debug-latest --cleanup-tag -y || true
          git push --delete origin debug-latest || true

      - name: Upload Debug Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: "Latest Debug Build (Level Editor enabled)"
          body: "Auto-generated DEBUG APKs. Level Editor aur baaki debug-only tools yahan enabled hain — home screen pe 'By GamerArnabXYZ' text ko 3 second long-press karo."
          files: app/build/outputs/apk/debug/*.apk
          prerelease: true
