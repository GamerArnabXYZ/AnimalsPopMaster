plugins {
    id 'com.android.application'
}

android {
    namespace "com.gax.bubbleshoot"
    compileSdk 36

    defaultConfig {
        applicationId "com.gax.bubbleshoot"
        // minSdk 21 rakha hai purposely -> purane (Android 5.0+) devices bhi support honge
        minSdk 21
        // targetSdk 36 (Android 16) -> Google Play ka Aug 31, 2026 wala mandatory requirement
        targetSdk 36
        versionCode 3
        versionName "1.2"
    }

    // Yahan splits block add kiya gaya hai
    splits {
        abi {
            // Separate APKs generate karna enable karega
            enable true
            
            // Default list clear karke sirf niche diye gaye ABIs include karega
            reset()
            
            // Aaj kal ke sabhi Android phones ke architectures
            include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            
            // True rakhne se ek 'Universal APK' bhi banega jisme sabhi architectures honge. 
            // Agar aapko sirf separate APKs chahiye, toh isko 'false' kar sakte hain.
            universalApk true 
        }
    }

        buildTypes {
        release {
            // 1. Unused Java/Kotlin code aur libraries se faltu methods remove karta hai
            minifyEnabled true

            // 2. Unused images, layouts aur assets ko APK se delete karta hai
            shrinkResources true

            // 3. Normal proguard file ki jagah 'optimize' version use karein (Zyada compression ke liye)
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // AGP 8.0+ mein BuildConfig generation default OFF hai (pehle automatic
    // tha) - MenuFragment mein BuildConfig.DEBUG use hota hai (Level Editor
    // ka debug-only trigger), isliye explicitly enable karna zaroori hai.
    buildFeatures {
        buildConfig true
    }

    // Naye dependencies (esp. play-services-ads) META-INF license/notice files
    // duplicate kar dete hain -> yeh unhe silently exclude karta hai taaki
    // packaging step fail na ho
    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/DEPENDENCIES']
        }
    }
}

dependencies {
    // NOTE: appcompat 1.8.0+ aur play-services-ads 24.0.0+ ne minSdk 23 mandatory
    // kar diya hai. Humne minSdk 21 (old-device support) rakhne ke liye jaan-bujhke
    // in libraries ka last minSdk-21-compatible stable version use kiya hai.
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core-splashscreen:1.2.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
    implementation 'com.github.nativegamestudio:natty-engine:1.0'
}
